        <div class="flex gap-sm">
          <button id="send-quote"   class="flex-1 bg-tertiary text-on-tertiary py-sm rounded-lg font-body-md hover:opacity-90 transition-all">Enviar por WhatsApp</button>
          <button id="cancel-quote" class="px-lg border border-outline-variant text-on-surface-variant py-sm rounded-lg hover:bg-surface-container transition-all">Cancelar</button>

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.remove("opacity-0");
        t.classList.add("opacity-100");
        clearTimeout(t._t);
        t._t = setTimeout(() => { t.classList.remove("opacity-100"); t.classList.add("opacity-0"); }, 2800);
      }

        return Array.from({ length: 5 }, (_, i) =>
          `<span class="material-symbols-outlined ${i < Math.floor(n) ? "fill-icon" : ""} text-tertiary" style="font-size:18px">star</span>`
        ).join("");
      }

      // ── Render página ────────────────────────────────────────────────────────

              <span class="text-body-sm font-medium">${m.label}</span>

            </div>
            <div class="flex flex-col justify-between py-1 pr-6">

                <h3 class="font-bold text-body-md">${item.name}</h3>
                <p class="text-body-sm text-on-surface-variant">${item.desc}</p>
              </div>
              <p class="text-tertiary font-bold">${item.price}</p>
            </div>
          </div>
        `).join("");

        const reviewsHtml = s.reviews.map(r => `
          <div class="pb-md border-b border-outline-variant last:border-0 last:pb-0">
            <div class="flex justify-between items-start mb-2">
              <div>
                <p class="text-body-md font-bold">${r.name}</p>
                <p class="text-body-sm text-on-surface-variant">${r.role}</p>
              </div>
              <div class="flex">${starHtml(r.stars)}</div>
            </div>
            <p class="text-body-md text-on-surface-variant">${r.text}</p>
          </div>

            <div class="flex items-center gap-md">
              <div class="w-20 h-20 md:w-24 md:h-24 bg-tertiary-fixed rounded-xl flex items-center justify-center border border-outline-variant">

                <div class="space-y-md">

            const idx        = parseInt(card.dataset.idx);
            const toggleRing = card.querySelector(".toggle-ring");
            const toggleIcon = card.querySelector(".toggle-icon");
            const nowSelected = !selected.has(idx);
            nowSelected ? selected.add(idx) : selected.delete(idx);
            applyCardState(card, idx, nowSelected);
            syncQuoteBtn();
            syncSelectAllBtn();
          });
        });

        function syncQuoteBtn() {
          const btn = document.getElementById("quote-open-btn");
          if (!btn) return;
          btn.textContent = selected.size > 0
            ? `Cotizar ${selected.size} servicio${selected.size > 1 ? "s" : ""}`
            : "Solicitar Cotización";
        }

        function applyCardState(card, idx, isSelected) {
          const toggleRing = card.querySelector(".toggle-ring");
          const toggleIcon = card.querySelector(".toggle-icon");
          if (isSelected) {
            card.style.borderColor     = "#00261a";
            card.style.backgroundColor = "rgba(191,237,214,0.15)";
            toggleRing.style.background  = "#00261a";
            toggleRing.style.borderColor = "#00261a";
            toggleIcon.textContent = "check";
            toggleIcon.style.color = "#ffffff";
          } else {
            card.style.borderColor     = "#cdc5ba";
            card.style.backgroundColor = "";
            toggleRing.style.background  = "#ffffff";
            toggleRing.style.borderColor = "#cdc5ba";
            toggleIcon.textContent = "add";
            toggleIcon.style.color = "#4b463d";
          }
        }

        function syncSelectAllBtn() {
          const btn = document.getElementById("select-all-btn");
          if (!btn) return;
          const allSelected = selected.size === s.catalog.length;
          btn.textContent = allSelected ? "Quitar todo" : "Seleccionar todo";
        }

        // Select / deselect all
        document.getElementById("select-all-btn").addEventListener("click", () => {
          const allSelected = selected.size === s.catalog.length;
          document.querySelectorAll(".catalog-card").forEach(card => {
            const idx = parseInt(card.dataset.idx);
            if (allSelected) {
              selected.delete(idx);
            } else {
              selected.add(idx);
            }
            applyCardState(card, idx, !allSelected);
          });
          syncQuoteBtn();
          syncSelectAllBtn();
        });

        // Botón cotización
        const openBtn = document.getElementById("quote-open-btn");
        if (openBtn) {
          openBtn.addEventListener("click", () => {
            document.getElementById("modal-supplier-name").textContent = s.name;
            const section = document.getElementById("modal-selected-section");
            const list    = document.getElementById("modal-items-list");
            if (selected.size > 0) {
              list.innerHTML = [...selected].sort((a, b) => a - b).map(idx => {
                const item = s.catalog[idx];
                return `<li class="flex items-center justify-between gap-sm">
                  <span class="flex items-center gap-xs text-body-sm">
                    <span class="material-symbols-outlined text-tertiary" style="font-size:16px">check_circle</span>
                    ${item.name}
                  </span>
                  <span class="font-bold text-body-sm whitespace-nowrap" style="color:#00261a">${item.price}</span>
                </li>`;
              }).join("");
              section.classList.remove("hidden");
              document.getElementById("quote-desc").placeholder = "Comentarios adicionales (opcional)...";
            } else {
              section.classList.add("hidden");
              document.getElementById("quote-desc").placeholder = "Describe el servicio que necesitas...";
            }
            modal.classList.remove("hidden");
            modal.classList.add("flex");
          });
        }

        // Favoritos toggle
        const favBtn  = document.getElementById("fav-btn");
        const favIcon = favBtn.querySelector(".material-symbols-outlined");
        let isFav = false;
        favBtn.addEventListener("click", () => {
          isFav = !isFav;
          favIcon.classList.toggle("fill-icon", isFav);
          favIcon.style.color = isFav ? "#b00020" : "";
          showToast(isFav ? "Guardado en favoritos" : "Eliminado de favoritos");
        });
      }

      const selected = new Set();
      renderPage();

      // ── Modal ────────────────────────────────────────────────────────────────
      const modal = document.getElementById("quote-modal");

      function closeModal() {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }

      document.getElementById("close-modal").addEventListener("click", closeModal);
      document.getElementById("cancel-quote").addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      document.getElementById("send-quote").addEventListener("click", () => {
        const empresa = document.getElementById("quote-empresa").value.trim();
        const email   = document.getElementById("quote-email").value.trim();
        const desc    = document.getElementById("quote-desc").value.trim();

        if (!empresa) {
          showToast("⚠ Ingresa el nombre de tu empresa");
          return;
        }
        if (selected.size === 0) {
          showToast("⚠ Selecciona al menos un servicio del catálogo");
          return;
        }

        const lines = [
          "Hola, me contacto a través de *Fetchy*.",
          `🏢 Empresa: ${empresa}`,
          email ? `📧 Correo: ${email}` : null,
        ];

        if (selected.size > 0) {
          lines.push("\n📋 *Servicios de interés:*");
          [...selected].sort((a, b) => a - b).forEach(idx => {
            const item = s.catalog[idx];
            lines.push(`• ${item.name} — ${item.price}`);
          });
        }

        if (desc) lines.push(`\n💬 Comentarios: ${desc}`);
        lines.push("\n¿Podrían enviarme una cotización formal?");

        closeModal();
        window.open(`https://wa.me/${s.phone}?text=${encodeURIComponent(lines.filter(Boolean).join("\n"))}`, "_blank");
      });
    </script>
  </body>
</html>
